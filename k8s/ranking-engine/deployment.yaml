apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranking-engine
  namespace: aroundu
  labels:
    app.kubernetes.io/name: ranking-engine
    app.kubernetes.io/part-of: aroundu
    app.kubernetes.io/component: ranking
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ranking-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ranking-engine
        app.kubernetes.io/part-of: aroundu
        app.kubernetes.io/component: ranking
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z postgres-service 5432; do
                sleep 2
              done
              echo "PostgreSQL is ready."
      containers:
        - name: ranking-engine
          image: aroundu-ranking-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50052
              protocol: TCP
              name: grpc
          env:
            - name: RANKING__SERVER__GRPC_PORT
              value: "50052"
            - name: RANKING__DATABASE__URL
              valueFrom:
                secretKeyRef:
                  name: aroundu-secrets
                  key: ranking-database-url
            - name: RANKING__DATABASE__MAX_CONNECTIONS
              value: "10"
            - name: RANKING__REDIS__URL
              valueFrom:
                secretKeyRef:
                  name: aroundu-secrets
                  key: ranking-redis-url
            - name: RUST_LOG
              value: "ranking_server=info,candidate_pipeline=info"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "true"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "true"
            initialDelaySeconds: 10
            periodSeconds: 30

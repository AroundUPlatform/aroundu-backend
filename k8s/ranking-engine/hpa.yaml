apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ranking-engine-hpa
  namespace: aroundu
  labels:
    app.kubernetes.io/name: ranking-engine
    app.kubernetes.io/part-of: aroundu
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ranking-engine
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

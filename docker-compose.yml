services:
  # ── Application ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: AroundU
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: ${SERVER_PORT}
      # Prod DB – resolves to the internal 'db' service
      PROD_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      PROD_DB_USERNAME: ${POSTGRES_USER}
      PROD_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Prod Redis – resolves to the internal 'redis' service
      PROD_REDIS_HOST: redis
      PROD_REDIS_PORT: 6379
      PROD_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # JWT (must be set in .env)
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS}
      # Admin seeder
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      # Payload encryption
      PAYLOAD_ENCRYPTION_KEY: ${PAYLOAD_ENCRYPTION_KEY}
      # Ranking Engine
      RANKING_ENGINE_HOST: ranking-engine
      RANKING_ENGINE_PORT: 50052
      RANKING_ENGINE_ENABLED: ${RANKING_ENGINE_ENABLED:-false}
    ports:
      - "${SERVER_PORT:-20232}:${SERVER_PORT:-20232}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${SERVER_PORT:-20232}/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    volumes:
      - app_logs:/app/logs
    networks:
      - AroundU-Network

  # ── PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: AroundU-DB
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - AroundU-Network

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: AroundU-Redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - AroundU-Network

  # ── Ranking Engine (Rust gRPC) ────────────────────────────────
  ranking-engine:
    build:
      context: ../aroundu-ranking-engine
      dockerfile: docker/Dockerfile
    container_name: AroundU-Ranking-Engine
    restart: unless-stopped
    working_dir: /etc/ranking-engine
    environment:
      RANKING__SERVER__GRPC_PORT: 50052
      RANKING__DATABASE__URL: ${RANKING_DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      RANKING__DATABASE__MAX_CONNECTIONS: 10
      RANKING__REDIS__URL: ${RANKING_REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379}
      RUST_LOG: ranking_server=info,candidate_pipeline=info
    ports:
      - "50052:50052"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - AroundU-Network

  # ── Prometheus ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: AroundU-Prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      app:
        condition: service_healthy
    networks:
      - AroundU-Network

  # ── Grafana ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: AroundU-Grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - AroundU-Network

volumes:
  db_data:
  redis_data:
  app_logs:
  prometheus_data:
  grafana_data:

networks:
  AroundU-Network:
    driver: bridge
